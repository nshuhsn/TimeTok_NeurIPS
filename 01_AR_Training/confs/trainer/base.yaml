light_name: light_ar


optimizer:
  lr: 0.002
  warmup_steps: 100
  gradient_accumulate_every: 4
  weight_decay: 0.1
scheduler: none


callbacks:
  monitor: val_loss 
  check_val_every_n_steps: 50
  generate_every_n_steps: 50
  max_epochs: 200
  max_steps: 50
  save_top_k: 1
  monitor_mode: min
  patience: 500
  min_delta: 0

dataset:
  batch_size: 32
  num_workers: 4
